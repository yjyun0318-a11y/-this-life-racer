<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>이번 생은 레이서다</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1018;color:#f4f7fb;font-family:Arial,'Noto Sans KR',sans-serif}.wrap{max-width:850px;margin:auto;padding:18px}.panel{background:#111824;border:1px solid #2a3547;border-radius:18px;padding:22px;margin:12px 0}.hero{text-align:center;padding:70px 20px}.hero h1{font-size:42px;margin:8px 0}.muted{color:#9ca9ba}.btn{border:1px solid #344158;background:#172130;color:#fff;border-radius:12px;padding:13px 17px;font-weight:700}.btn:hover{filter:brightness(1.08)}.primary{background:#4f91ff;border-color:#4f91ff;color:#07111f}.danger{border-color:#713c42;color:#ffb7bc}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.row{display:flex;gap:10px}.row>*{flex:1}label{display:block;margin:14px 0 6px;font-weight:700}input{width:100%;background:#0d131d;color:#fff;border:1px solid #344158;border-radius:11px;padding:12px}.team,.type,.offer{width:100%;text-align:left;min-height:62px}.selected{outline:2px solid #4f91ff}.stat{background:#151e2b;border:1px solid #2b374b;border-radius:13px;padding:13px}.sn{font-size:13px;color:#9ba8ba}.sv{font-size:23px;font-weight:800;margin-top:3px}.big{font-size:42px;font-weight:900}.table{width:100%;border-collapse:collapse}.table td{padding:10px 2px;border-bottom:1px solid #293244}.table td:last-child{text-align:right;font-weight:800}.note{background:#0e1622;border-left:3px solid #4f91ff;padding:12px;border-radius:8px;line-height:1.5}.tag{display:inline-block;padding:5px 9px;border:1px solid #334158;border-radius:999px;font-size:12px;margin:2px}.award{border:1px solid #46536a;background:#161f2c;border-radius:12px;padding:12px}.feed{border:1px solid #344158;background:#0f1722;border-radius:12px;padding:12px}.sectionTitle{font-weight:800;margin:18px 0 9px}.highlight{background:linear-gradient(135deg,#182545,#111c32);border:1px solid #344d84}.career-card{background:#151e2b;border:1px solid #2b374b;border-radius:14px;padding:15px}.good{color:#78d6a3}.warn{color:#ffd36e}.bad{color:#ff9da6}@media(max-width:650px){.three{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.hero h1{font-size:32px}}
</style></head>
<body><div class="wrap" id="app"></div>
<script>
const app=document.getElementById('app');
const statNames=['⚡ 스피드','🔄 코너링','🛑 브레이킹','🏁 레이스 감각','🧠 판단력','🔧 적응력'];
const typeBase={올라운더:[51,51,50,51,49,48],스피드스터:[67,64,39,47,42,41],'코너 스페셜리스트':[52,67,47,48,46,43],'브레이킹 마스터':[47,51,65,55,54,28],'레이스 크래프터':[43,46,50,66,64,31],정밀형:[45,50,61,44,64,36],적응형:[45,46,46,47,58,59]};
const f1Teams=['메르세데스','페라리','맥라렌','레드불 레이싱','레이싱 불스','알핀','하스','아우디','윌리엄스','애스턴 마틴','캐딜락'];
const R=(a,b)=>Math.random()*(b-a)+a, A=a=>a.reduce((x,y)=>x+y,0)/a.length, F=n=>Number(n).toFixed(1), ri=(a,b)=>Math.floor(R(a,b+1));
let p={name:'',num:null,fav:'',age:16,ovr:0,type:'',stats:[],team:'',car:0,potential:0,peak:0,peakAge:0,career:[],awards:[],records:[],status:'유망주',level:'F4',contract:2,failedTests:0,retired:false};
function statHTML(a){return '<div class="grid">'+a.map((v,i)=>`<div class="stat"><div class="sn">${statNames[i]}</div><div class="sv">${F(v)}</div></div>`).join('')+'</div>'}
function makeStats(t){let a=typeBase[t].map(v=>Math.max(25,Math.min(75,v+R(-4,4))));let d=50-A(a);return a.map(v=>+(Math.max(25,Math.min(75,v+d)).toFixed(1)))}
function home(){app.innerHTML=`<div class="panel hero"><div class="muted">RACING CAREER SIMULATION</div><h1>🏁 이번 생은 레이서다</h1><p class="muted">16세 F4 데뷔부터 정상급 드라이버, 좌절과 재기, 은퇴까지<br>한 명의 레이서 인생을 빠르게 시뮬레이션합니다.</p><button class="btn primary" onclick="create()">새로운 커리어 시작</button></div>`}
function create(){app.innerHTML=`<div class="panel"><h2>드라이버 생성</h2><p class="muted">이름과 레이스 번호는 반드시 입력해야 합니다.</p><label>이름</label><input id="name" maxlength="16" placeholder="이름을 입력하세요"><label>레이스 번호</label><input id="num" type="number" placeholder="1~99" min="1" max="99"><label>선호 F1 팀</label><div class="grid">${f1Teams.map(t=>`<button class="btn team" onclick="chooseTeam(this,'${t}')">${t}</button>`).join('')}</div><div class="row" style="margin-top:18px"><button class="btn" onclick="home()">이전</button><button class="btn primary" onclick="typesPage()">유형 선택</button></div></div>`}
function chooseTeam(el,t){p.fav=t;document.querySelectorAll('.team').forEach(x=>x.classList.remove('selected'));el.classList.add('selected')}
function typesPage(){const name=document.getElementById('name').value.trim(),raw=document.getElementById('num').value.trim(),num=Number(raw);if(!name){alert('이름을 입력해주세요.');document.getElementById('name').focus();return}if(!raw||!Number.isInteger(num)||num<1||num>99){alert('레이스 번호를 1~99 사이의 정수로 입력해주세요.');document.getElementById('num').focus();return}p.name=name;p.num=num;if(!p.fav)p.fav=f1Teams[0];let ks=Object.keys(typeBase).sort(()=>Math.random()-.5).slice(0,3),gen={};app.innerHTML=`<div class="panel"><h2>드라이버 유형</h2><p class="muted">세 유형은 매번 랜덤으로 나오며, 같은 유형도 능력치가 조금씩 달라집니다.</p><div id="choices" class="three"></div><div id="preview" style="margin-top:16px"></div><div class="row" style="margin-top:18px"><button class="btn" onclick="create()">이전</button><button class="btn primary" id="go" disabled>이 유형으로 시작</button></div></div>`;ks.forEach(k=>{let b=document.createElement('button');b.className='btn type';b.textContent=k;b.onclick=()=>{gen[k]??=makeStats(k);p.type=k;p.stats=gen[k];document.querySelectorAll('.type').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.getElementById('preview').innerHTML=`<div class="panel highlight"><div style="display:flex;justify-content:space-between"><b>${k}</b><b>시작 OVR ${F(A(p.stats))}</b></div><div style="margin-top:12px">${statHTML(p.stats)}</div></div>`;document.getElementById('go').disabled=false}};document.getElementById('choices').append(...ks.map(k=>{let b=document.createElement('button');b.className='btn type';b.textContent=k;b.onclick=()=>{gen[k]??=makeStats(k);p.type=k;p.stats=gen[k];document.querySelectorAll('.type').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.getElementById('preview').innerHTML=`<div class="panel highlight"><div style="display:flex;justify-content:space-between"><b>${k}</b><b>시작 OVR ${F(A(p.stats))}</b></div><div style="margin-top:12px">${statHTML(p.stats)}</div></div>`;document.getElementById('go').disabled=false};return b}));document.getElementById('go').onclick=profile}
function profile(){p.ovr=+A(p.stats).toFixed(1);p.potential=Math.round(R(68,91));p.peak=Math.max(p.ovr+2,Math.min(p.potential,R(p.potential-2,p.potential)));p.peakAge=ri(27,32);app.innerHTML=`<div class="panel"><div style="display:flex;justify-content:space-between"><div><div class="muted">ROOKIE PROFILE</div><h2>${p.name} #${p.num}</h2><span class="tag">${p.type}</span></div><div style="text-align:center"><div class="muted">OVR</div><div class="big">${F(p.ovr)}</div></div></div><div style="margin-top:18px">${statHTML(p.stats)}</div><div class="note" style="margin-top:16px">선호 F1 팀: <b>${p.fav}</b><br>현재는 F4에서 시작합니다. 이 선수의 진짜 전성기 고점은 게임 내부에서 숨겨져 있습니다.</div><div class="row" style="margin-top:18px"><button class="btn" onclick="typesPage()">이전</button><button class="btn primary" onclick="offers()">16세 시즌 시작</button></div></div>`}
function offers(){let os=[['노바 레이싱',ri(78,88),ri(55,72)],['블루라인 모터스포츠',ri(72,82),ri(76,91)],['골든스타 레이싱',ri(68,77),ri(85,96)]];app.innerHTML=`<div class="panel"><div class="muted">16세 · F4</div><h2>팀 영입 제안</h2><p class="muted">차량 경쟁력과 육성 능력이 서로 다릅니다.</p><div id="offers"></div></div>`;os.forEach(o=>{let b=document.createElement('button');b.className='btn offer';b.style.marginTop='10px';b.innerHTML=`<b>${o[0]}</b><br><span class="muted">차량 경쟁력 ${o[1]} · 육성 ${o[2]}</span>`;b.onclick=()=>{p.team=o[0];p.car=o[1];p.level='F4';p.contract=2;seasonIntro()};document.getElementById('offers').appendChild(b)})}
function seasonIntro(){app.innerHTML=`<div class="panel"><div class="muted">${p.age}세 · ${p.level} · ${p.team}</div><h2>시즌 준비 완료</h2><div class="grid" style="margin-top:16px"><div class="stat"><div class="sn">드라이버 OVR</div><div class="sv">${F(p.ovr)}</div></div><div class="stat"><div class="sn">차량 경쟁력</div><div class="sv">${p.car}</div></div></div><button class="btn primary" style="width:100%;margin-top:16px" onclick="simulate()">🏁 시즌 진행</button></div>`}
function seasonLabel(){return p.level==='F4'?'FIA F4':p.level==='FR'?'Formula Regional':p.level==='F3'?'FIA F3':p.level==='F2'?'FIA F2':'F1'}
function simulate(){let catFactor={F4:0,FR:1,F3:2,F2:3,F1:5}[p.level],ability=(p.ovr-50)*.13,car=(p.car-70)*.08,variance=R(-4.5,4.5);let af=Math.max(1.5,Math.min(24,13-catFactor-ability-car+variance));let podium=Math.max(0,Math.min(10,Math.round((7.5-af)*1.25+R(-1.5,1.5))));let wins=Math.max(0,Math.min(podium,Math.round((3.3-af)*.8+R(-.8,.8))));let poles=Math.max(0,Math.min(8,Math.round((4.5-af)*.6+R(-.8,.8))));let dnf=Math.max(0,Math.min(7,Math.round(R(0,3)+(100-p.stats[4]-p.stats[5])/48)));let finish=24-dnf;let points=Math.max(0,Math.round((27-af)*finish+R(-18,18)));let rank=Math.max(1,Math.min(30,Math.round(af+R(-2.5,2.5))));let grade=af<5?'A+':af<8?'A':af<11?'B+':af<14?'B':af<17?'C+':'C';let awards=[],records=[],summary='';if(rank===1){awards.push('🏆 '+seasonLabel()+' 챔피언');summary='압도적인 시즌을 보내며 챔피언 타이틀을 거머쥐었습니다.'}else if(wins>=4){awards.push('🥇 최다 우승');summary='여러 차례 정상에 오르며 강한 존재감을 보여준 시즌이었습니다.'}else if(podium>=6){summary='꾸준한 포디움 행진으로 시즌 후반까지 상위권을 지킨 시즌이었습니다.'}else if(rank<=8){summary='차량 성능 이상의 결과를 만들어내며 다음 단계에 대한 기대를 높였습니다.'}else if(rank>=18){summary='기대보다 어려운 시즌을 보냈고 다음 시즌 반등이 필요해졌습니다.'}else{summary='성장과 시행착오가 공존했던 한 시즌이었습니다.'}if(p.age===16&&rank<=3){awards.push('⭐ 올해의 신인')}if(podium>=8){records.push('📜 한 시즌 최다 포디움 경신')}if(wins>=5){records.push('📜 한 시즌 최다 우승 기록 경신')}if(poles>=4){records.push('🎯 예선 경쟁력 최고 기록')}let result={age:p.age,level:p.level,team:p.team,rank,af,wins,podium,poles,points,finish,dnf,grade,summary,awards,records,before:p.ovr};let growth=0;if(p.age<21)growth=R(1,4.5);else if(p.age<=26)growth=R(.5,3);else if(p.age<=31)growth=R(-.3,1.8);else if(p.age<=34)growth=R(-1.5,.7);else if(p.age<=37)growth=R(-3.5,-.3);else growth=R(-6,-1.5);let ceiling=Math.min(p.peak,p.potential);if(p.ovr<ceiling)growth=Math.min(growth,Math.max(.1,ceiling-p.ovr));else growth=Math.min(growth,0);p.ovr=Math.max(35,Math.min(ceiling,+(p.ovr+growth).toFixed(1)));p.stats=p.stats.map(v=>+(Math.max(25,Math.min(99,v+R(-.2,1.4))).toFixed(1)));result.after=p.ovr;p.career.push(result);if(awards.length)p.awards.push(...awards);if(records.length)p.records.push(...records);showSeason(result)}
function showSeason(r){let fan=r.rank<=3?'“다음 단계에서도 이 정도 페이스를 보여줄 수 있을까?”':r.rank>=18?'“이번 시즌은 조금 아쉬웠다. 반등이 필요해 보인다.”':'“조금씩 성장하는 모습이 보인다.”';app.innerHTML=`<div class="panel"><div class="muted">${r.age}세 · ${seasonLabel()} · 시즌 종료</div><h2>${r.age+2010} 시즌 결과</h2><div class="panel highlight"><div class="muted">SEASON REVIEW</div><h3 style="margin-top:7px">${r.summary}</h3></div><div class="grid"><div class="stat"><div class="sn">챔피언십</div><div class="sv">${r.rank}위</div></div><div class="stat"><div class="sn">평균 결승</div><div class="sv">${F(r.af)}위</div></div><div class="stat"><div class="sn">우승</div><div class="sv">${r.wins}</div></div><div class="stat"><div class="sn">포디움</div><div class="sv">${r.podium}</div></div><div class="stat"><div class="sn">폴</div><div class="sv">${r.poles}</div></div><div class="stat"><div class="sn">포인트</div><div class="sv">${r.points}</div></div></div>${r.awards.length?`<div class="sectionTitle">🏆 시즌 수상</div><div class="grid">${r.awards.map(x=>`<div class="award">${x}</div>`).join('')}</div>`:''}${r.records.length?`<div class="sectionTitle">📜 주요 기록</div><div class="grid">${r.records.map(x=>`<div class="award">${x}</div>`).join('')}</div>`:''}<div class="sectionTitle">🏎️ TEAM RESULT</div><div class="career-card"><b>${r.team}</b><br><span class="muted">드라이버 챔피언십 ${r.rank}위 · 평균 ${F(r.af)}위</span></div><div class="panel" style="margin-top:16px;background:#26378b"><div class="muted" style="color:#b9c7ff">OVR 변화</div><b style="font-size:28px">${F(r.before)} → ${F(r.after)}</b></div><div class="sectionTitle">▸ 상세 기록</div><div class="career-card"><table class="table"><tr><td>출장</td><td>24</td></tr><tr><td>완주</td><td>${r.finish}</td></tr><tr><td>DNF</td><td>${r.dnf}</td></tr></table></div><div class="sectionTitle">💬 FAN FEED</div><div class="feed">${fan}</div><div class="row" style="margin-top:18px"><button class="btn primary" onclick="nextCareer()">다음</button><button class="btn danger" onclick="retire()">현역 은퇴</button></div></div>`}
function nextCareer(){p.age++;if(p.retired)return;careerDecision()}
function careerDecision(){if(p.level==='F1'){f1Season();return}let rank=p.career.at(-1).rank,success=rank<=Math.max(4,8-(p.age-16)),fail=rank>=17;if(p.contract>0)p.contract--;if(fail&&p.contract<=0){contractTrouble();return}if(success){if(p.level==='F4'&&p.age>=17)p.level='FR';else if(p.level==='FR'&&p.age>=19)p.level='F3';else if(p.level==='F3'&&p.age>=21)p.level='F2';else if(p.level==='F2'&&p.age>=22&&p.ovr>=68&&Math.random()<.58){f1Offer();return}seasonAfterPromotion()}else if(fail&&p.contract<=0)contractTrouble();else seasonAfterPromotion()}
function seasonAfterPromotion(){p.car=Math.max(65,Math.min(97,Math.round(p.car+R(-4,6))));p.contract=ri(1,3);seasonIntro()}
function f1Offer(){p.level='F1';p.team=p.fav; p.car=ri(72,91);p.contract=2;app.innerHTML=`<div class="panel highlight"><div class="muted">CAREER BREAKTHROUGH</div><h2>🏎️ ${p.fav} F1 시트 제안</h2><p>F2에서의 성적과 드라이버 가치가 인정되어 정식 F1 시트 제안을 받았습니다.</p><button class="btn primary" style="width:100%" onclick="seasonAfterPromotion()">F1 데뷔</button></div>`}
function f1Season(){p.car=Math.max(65,Math.min(99,Math.round(p.car+R(-3,6))));seasonIntro()}
function contractTrouble(){app.innerHTML=`<div class="panel"><div class="muted">${p.age}세 · 계약 만료</div><h2>⚠️ 팀에서 방출되었습니다</h2><p class="muted">최근 몇 시즌의 성적이 기대에 미치지 못해 다음 시즌 시트를 확보하지 못했습니다.</p><div class="sectionTitle">새로운 기회</div><div class="grid"><button class="btn offer" onclick="driverMarket()"><b>🏁 드라이버 시장</b><br><span class="muted">다른 팀의 제안을 기다린다</span></button><button class="btn offer" onclick="testOffer()"><b>🔧 팀 테스트</b><br><span class="muted">테스트를 통해 다시 입단한다</span></button></div><button class="btn danger" style="width:100%;margin-top:12px" onclick="retire()">은퇴한다</button></div>`}
function driverMarket(){let offers=[['F2 하위권 팀',ri(65,76),0.68],['F3 상위권 팀',ri(78,89),0.86],['테스트 드라이버',ri(70,80),0.78]];app.innerHTML=`<div class="panel"><div class="muted">DRIVER MARKET</div><h2>새로운 팀을 찾습니다</h2><p class="muted">한 단계 내려가 다시 올라가는 것도 하나의 커리어입니다.</p><div id="market"></div></div>`;offers.forEach(o=>{let b=document.createElement('button');b.className='btn offer';b.style.marginTop='10px';b.innerHTML=`<b>${o[0]}</b><br><span class="muted">차량 경쟁력 ${o[1]}</span>`;b.onclick=()=>{p.team=o[0];p.level=o[0].includes('F3')?'F3':o[0].includes('F2')?'F2':'F2';p.car=o[1];p.contract=1;seasonIntro()};document.getElementById('market').appendChild(b)})}
function testOffer(){let chance=Math.min(.9,.35+p.ovr/140+p.stats[5]/300);let pass=Math.random()<chance;app.innerHTML=`<div class="panel ${pass?'highlight':''}"><div class="muted">TEAM TEST</div><h2>${pass?'✅ 테스트 합격':'❌ 테스트 탈락'}</h2><p>${pass?'팀이 테스트 결과에 만족했습니다. 다시 프로 시트를 얻었습니다.':'이번 테스트에서 정식 시트를 확보하지 못했습니다.'}</p>${pass?`<button class="btn primary" style="width:100%" onclick="driverMarket()">계약 선택</button>`:`<div class="note">남은 테스트 기회가 있으면 한 번 더 도전할 수 있습니다.</div><button class="btn primary" style="width:100%;margin-top:12px" onclick="retryTest()">다시 테스트하기</button><button class="btn danger" style="width:100%;margin-top:10px" onclick="retire()">은퇴</button>`}</div>`}
function retryTest(){p.failedTests++;if(p.failedTests>=2&&Math.random()<.55){retire();return}testOffer()}
function retire(){p.retired=true;app.innerHTML=`<div class="panel hero"><div class="muted">CAREER END</div><h1>🏁 현역 은퇴</h1><p>${p.name} #${p.num}의 레이싱 커리어가 막을 내렸습니다.</p><div class="grid" style="margin-top:20px"><div class="stat"><div class="sn">최고 OVR</div><div class="sv">${F(Math.max(...p.career.map(x=>x.after),p.ovr))}</div></div><div class="stat"><div class="sn">커리어 시즌</div><div class="sv">${p.career.length}</div></div></div><div class="sectionTitle">🏆 커리어 수상</div><div class="career-card">${p.awards.length?p.awards.map(x=>`<div>${x}</div>`).join(''):'특별 수상 기록 없음'}</div><button class="btn primary" style="margin-top:18px" onclick="home()">새로운 인생 시작</button></div>`}
home();
</script></body></html>
